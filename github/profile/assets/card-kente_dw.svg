<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 232" width="600" height="232" role="img" aria-label="Kente Data Warehouse: A warehouse built from scratch with dbt: bronze, silver, gold, snapshots and tests.">
<style>
  .pulse{stroke-dasharray:110 1590;animation:run 5s linear infinite;animation-delay:-0.0s}
  .rule{animation:rule 5s ease-in-out infinite;animation-delay:-0.0s}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes bolt{0%,100%{opacity:.92}6%{opacity:.35}9%{opacity:1}44%{opacity:.9}47%{opacity:.5}50%{opacity:1}}
  @keyframes arc{0%,100%{opacity:0}5%{opacity:1}12%{opacity:0}46%{opacity:.9}52%{opacity:0}}
  @keyframes run{to{stroke-dashoffset:-1700}}
  @keyframes rule{0%,100%{width:44px}50%{width:150px}}
  @keyframes grow{0%,100%{transform:scaleX(.2)}50%{transform:scaleX(1)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9b7bff" stop-opacity=".17"/><stop offset=".6" stop-color="#0f1728" stop-opacity="0"/></linearGradient>
  <pattern id="d" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#9b7bff"/></pattern>
  <linearGradient id="f" x1="1" y1="0" x2=".4" y2=".9"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="m"><rect width="600" height="232" fill="url(#f)"/></mask><clipPath id="c"><path d="M12 8H566a26 26 0 0 1 26 26V220a4 4 0 0 1 -4 4H34a26 26 0 0 1 -26 -26V12a4 4 0 0 1 4 -4z"/></clipPath>
  <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
