<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 232" width="600" height="232" role="img" aria-label="Airflow for Kente: Runs the warehouse build every day and stops if a quality check fails.">
<style>
  .pulse{stroke-dasharray:110 1590;animation:run 5s linear infinite;animation-delay:-0.8s}
  .rule{animation:rule 5s ease-in-out infinite;animation-delay:-0.8s}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes bolt{0%,100%{opacity:.92}6%{opacity:.35}9%{opacity:1}44%{opacity:.9}47%{opacity:.5}50%{opacity:1}}
  @keyframes arc{0%,100%{opacity:0}5%{opacity:1}12%{opacity:0}46%{opacity:.9}52%{opacity:0}}
  @keyframes run{to{stroke-dashoffset:-1700}}
  @keyframes rule{0%,100%{width:44px}50%{width:150px}}
  @keyframes grow{0%,100%{transform:scaleX(.2)}50%{transform:scaleX(1)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
