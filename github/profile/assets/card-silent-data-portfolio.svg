  <mask id="m"><rect width="600" height="232" fill="url(#f)"/></mask><clipPath id="c"><path d="M12 8H566a26 26 0 0 1 26 26V220a4 4 0 0 1 -4 4H34a26 26 0 0 1 -26 -26V12a4 4 0 0 1 4 -4z"/></clipPath>
  <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
