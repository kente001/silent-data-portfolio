<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 76" width="1200" height="76" role="img" aria-label="Selected work">
<style>
  .a{transform-origin:66px 38px;animation:spin 16s linear infinite}.b{transform-origin:66px 38px;animation:spin 10s linear infinite reverse}
  .bolt{animation:bolt 2.8s steps(1,end) infinite}.arc{opacity:0;animation:arc 2.8s steps(1,end) infinite}.arc.x{animation-delay:-1.3s}
  .line{transform-origin:0 0;animation:grow 6s ease-in-out infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes bolt{0%,100%{opacity:.92}6%{opacity:.35}9%{opacity:1}44%{opacity:.9}47%{opacity:.5}50%{opacity:1}}
  @keyframes arc{0%,100%{opacity:0}5%{opacity:1}12%{opacity:0}46%{opacity:.9}52%{opacity:0}}
  @keyframes run{to{stroke-dashoffset:-1700}}
  @keyframes rule{0%,100%{width:44px}50%{width:150px}}
  @keyframes grow{0%,100%{transform:scaleX(.2)}50%{transform:scaleX(1)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><filter id="g" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#22b8cf"/><stop offset="1" stop-color="#22b8cf" stop-opacity="0"/></linearGradient></defs>
<text x="0" y="45" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="16" fill="#64738a">02</text>
<g fill="none">
  <g class="a" stroke="#22b8cf"><circle cx="66" cy="38" r="30" stroke-dasharray="3 7" stroke-width="1.3"/>
    <path d="M66 4l3.5 4-3.5 4-3.5-4z" fill="#22b8cf" stroke="none"/><path d="M66 64l3.5 4-3.5 4-3.5-4z" fill="#22b8cf" stroke="none"/></g>
  <circle class="b" cx="66" cy="38" r="22.5" stroke="#3987e5" stroke-width="1.8" stroke-dasharray="20 8 4 8"/>
  <g stroke="#eaf6ff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#g)">
    <path class="arc" d="M90 14l6-5 2 6 7-3"/><path class="arc x" d="M42 62l-7 3 1-8-8 1"/></g>
  <path class="bolt" d="M70.500 19l-14.500 22h8.600l-3 16 14.500-22h-8.600z" fill="#22b8cf" stroke="#fff3d6" stroke-width=".8" filter="url(#g)"/>
</g>
<text x="116" y="50" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-weight="700" font-size="34" fill="#c9d4e3" letter-spacing="-.5">Selected work</text>
<g transform="translate(364 39)"><rect class="line" width="816" height="2" fill="url(#l)"/></g>
</svg>
